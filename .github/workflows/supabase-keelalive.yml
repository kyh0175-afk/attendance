# ─────────────────────────────────────────────────────────────
#  Supabase keep-alive
#  무료 플랜 Supabase 프로젝트는 7일간 API 요청이 없으면 자동 일시정지되고,
#  일시정지되면 도메인 자체가 사라져 앱에서 "TypeError: Failed to fetch"가 뜬다.
#  매일 아침(KST 07:05) 가벼운 SELECT를 날려 일시정지를 예방한다.
#  ★ 주 2회로는 최대 4일간 이상을 모른다. 매일 돌리면 실패 시 다음 날 아침
#    메일이 오므로, 학생들이 겪기 전에 먼저 알 수 있다. (공개 레포는 무료)
#  ⚠️ keep-alive는 '예방'만 한다. 이미 정지된 프로젝트는 DNS가 사라져
#    요청이 도착조차 못 하므로 대시보드에서 직접 Restore 해야 한다.
#
#  설치 위치:  attendance 레포  →  .github/workflows/supabase-keepalive.yml
#  키는 클라이언트 HTML에 이미 공개된 publishable(anon) 키라 그대로 적어도 안전하다.
# ─────────────────────────────────────────────────────────────
name: Supabase keep-alive

on:
  schedule:
    # UTC 매일 22:05  =  KST 매일 07:05 (학교 일과 시작 전)
    - cron: '5 22 * * *'
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  ping:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # 한쪽이 실패해도 나머지는 계속 시도
      matrix:
        include:
          - name: 출석 (cosmos)
            url: https://rxsmmwqekrtbstcjbagj.supabase.co
            key: sb_publishable_h7o2vnvgu7Akrg87cAYSkg__DA-KRpn
            table: sessions
          - name: 급식 (YB-meal)
            url: https://mvuxbngxpmdmxdkxohoc.supabase.co
            key: sb_publishable_h6vVNV3t-b2JSZAH2wuZ3g_bBq3_GwI
            table: meal_sessions
    steps:
      - name: REST 요청으로 프로젝트 깨우기
        run: |
          set -u
          code=000
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 30 \
              "${{ matrix.url }}/rest/v1/${{ matrix.table }}?select=*&limit=1" \
              -H "apikey: ${{ matrix.key }}" \
              -H "Authorization: Bearer ${{ matrix.key }}") || code=000
            echo "[$i회차] ${{ matrix.name }} → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ ${{ matrix.name }} 정상 응답"
              exit 0
            fi
            sleep 20
          done
          echo "❌ ${{ matrix.name }} 응답 실패 (마지막 코드: $code)"
          echo "--- 응답 본문 ---"
          head -c 500 /tmp/body.txt || true
          echo
          echo "--- DNS 조회 ---"
          HOST=$(echo "${{ matrix.url }}" | sed -e 's#^https\?://##' -e 's#/.*##')
          getent hosts "$HOST" || echo "  $HOST : 이름 없음 (NXDOMAIN)"
          echo
          if [ "$code" = "000" ]; then
            echo "▶ code=000 + NXDOMAIN = 프로젝트 일시정지 상태입니다."
            echo "  https://supabase.com/dashboard 에서 해당 프로젝트 Restore 후"
            echo "  이 워크플로를 Run workflow로 한 번 수동 실행해 확인하세요."
            echo "  (keep-alive는 예방용이라 이미 정지된 프로젝트를 깨우지 못합니다)"
          elif [ "$code" = "401" ]; then
            echo "▶ 401 = publishable 키가 바뀌었습니다. 워크플로의 key 값을 갱신하세요."
          elif [ "$code" = "404" ]; then
            echo "▶ 404 = 테이블 이름이 바뀌었거나 사라졌습니다."
          fi
          exit 1

  keep-repo-active:
    # GitHub은 60일간 레포 활동이 없으면 schedule 워크플로를 자동 비활성화한다.
    # 방학처럼 긴 공백에도 살아남도록, 45일 이상 커밋이 없을 때만 더미 커밋을 남긴다.
    name: 레포 활동 갱신
    needs: ping
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 45일 이상 커밋 없으면 타임스탬프 커밋
        run: |
          set -e
          LAST=$(git log -1 --format=%ct)
          NOW=$(date -u +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "마지막 커밋으로부터 ${DAYS}일 경과"
          if [ "$DAYS" -lt 45 ]; then
            echo "60일 자동 비활성화까지 여유 있음 — 커밋 생략"
            exit 0
          fi
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keep scheduled workflow alive"
          git push
